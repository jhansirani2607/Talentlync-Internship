<html>
    <head>
        <title>Registration form</title>
    </head>
    <body>
        <form>
            <label>Name:</label>
            <input type="text" placeholder="enter your name"><br>
            <label>Age:</label>
            <input type="number" min="18" max="48" placeholder="enter your age"><br>
            <label>Gender</label><br>
            <input type="radio" name="gender" value="female" placeholder="enter your name">Female</input><br>
            <input type="radio" name="gender" value="male" placeholder="enter your name">Male</input><br>
            <label>Branch:</label>
            <select>
                <option>CSE</option>
                <option>CIVIL</option>
                <option>EEE</option>
                <option>ECE</option>
            </select>  
            <br>
            <label>COURSES</label><br>
            <input type="checkbox" name="courses" value="python">PYTHON
            <input type="checkbox" name="courses" value="java">JAVA
            <input type="checkbox" name="courses" value="css">CSS
            <input type="checkbox" name="courses" value="javascript">JAVASCRIPT <br>
            <label>Email:</label>
            <input type="email" name="email"><br>
            <label>Password:</label>
            <input type="password" name="password"><br>
            <label>Mobile no:</label>
            <input type="tel" name="phone"><br>
            <button >Submit</button> 
            <button>Reset</button>
            
        </form>
    </body>
</html>
