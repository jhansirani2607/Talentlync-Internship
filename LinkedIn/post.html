<html>
    <head>
        <title>LinkedIn post page</title>

        <link
        rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="table.css">
        <link rel="stylesheet" href="card.css">


        <style>
            body {
                background-color: #f3f2ef;
                font-family: Arial, sans-serif;
                margin: 0;
            }

            /* HEADER */
            .header {
                background-color: white;
                height: 80px;
                padding: 10px 20px;
                border-bottom: 1px solid #ddd;
            }

            .header h1 {
                text-align: center;
                margin: 10px 0;
            }

            .header p {
                text-align: center;
                margin-top: -10px;
                color: #666;
            }


            /* MAIN POST AREA */
            .postcreate {
                display: flex;
                justify-content: center;
                align-items: flex-start;
                gap: 25px;
                padding: 20px;
                flex-wrap: wrap;
            }


            /* EACH FORM */
            .main {
                width: 400px;
                margin: 10px;
            }


            /* FORM CARD */
            .eventform {
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 10px;
                background-color: white;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }


            /* FORM ELEMENT */
            .form {
                margin-bottom: 18px;
            }

            label {
                display: block;
                margin-bottom: 7px;
                font-weight: bold;
                color: #333;
            }


            input,
            textarea,
            select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                box-sizing: border-box;
                margin-top: 5px;
            }

            textarea {
                resize: vertical;
            }


            /* RADIO BUTTONS */
            input[type="radio"] {
                width: auto;
                margin-right: 5px;
            }

            label[for="online"],
            label[for="inPerson"] {
                display: inline;
                font-weight: normal;
                margin-right: 15px;
            }


            /* BUTTON */
            button {
                padding: 10px 18px;
                background-color: #0a66c2;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            button:hover {
                background-color: #004182;
            }


            /* DATE AND TIME */
            .list {
                display: flex;
                gap: 15px;
            }

            .list .form {
                flex: 1;
            }


            /* FOOTER */
            .footer {
                background-color: white;
                padding: 15px;
                text-align: center;
                border-top: 1px solid #ddd;
            }

            .footer p {
                margin: 0;
                color: #555;
            }


            /* DOCUMENT */
            #documentTitle {
                margin-bottom: 10px;
            }


            /* POLL */
            #extraOptions {
                margin-top: 5px;
            }

            #extraOptions .form {
                margin-bottom: 15px;
            }
            .rendering{
                margin: 20px;
            }
            /* MOBILE RESPONSIVE */
            @media (max-width: 900px) {

                .postcreate {
                    flex-direction: column;
                    align-items: center;
                }

                .main {
                    width: 90%;
                    max-width: 400px;
                }

            }
        </style>
        <script>
            function post(){
                alert("posted successfully");
                window.location.href='mypost.html';
            }
        </script>
    </head>
    <body onload="EventData();displayDocumentData()">
        <div class="header">  
            <h1>👤 Dakka Jhansi Rani</h1>
            <p>Post to Anyone</p>
        </div>
        <div class="content">
            <input  type="text"placeholder="do you want to talk about?">
        </div>
        <div class="postcreate">
            <div class="main">
                <h1>Create an event</h1>
                <form class="eventform">
                    <div>
                        <label for="eventID">Event ID</label>
                        <input type="hidden" name="eventId" id="eventId" readonly />
                    </div>
                    <div class="form">
                        <label>Event type</label>

                        <input type="radio" id="online" name="eventType" value="online">
                        <label for="online">Online</label>

                        <input type="radio" id="inPerson" name="eventType" value="in person">
                        <label for="inPerson">In person</label>
                    </div>
                    <div class="form">
                        <label>Event name</label><br>
                        <textarea rows="1" cols="20px" id="eventName"></textarea>
                    </div>
                    <div class="list">
                        <div class="form">
                            <label>start date</label>
                            <input type="date" id="startDate" name="date">
                        </div>
                        
                        <div class="form">
                            <label>start time</label>
                            <input type="time" id="startTime"name="time1">
                        </div>
                    </div>
                    <div class="list">
                        <div class="form">
                            <label>end date</label>
                            <input type="date" id="endDate" name="date">
                        </div>
                        
                        <div class="form">
                            <label>end time</label>
                            <input type="time" id="endTime" name="time2">
                        </div>
                    </div>
                    <div class="form">
                        <label>External event link</label>
                        <textarea rows="1" cols="50" id="eventLinks"></textarea>
                    </div>
                    <button type="button" onclick="saveEvent()">Done</button>
                </form>
            </div> 
            
            <div class="main">
                <h1>Share a document</h1>
                <form class="eventform" >

                    <div class="form">
                        <label>Document title</label>
                        <input
                            type="text"
                            id="documentTitle"
                            placeholder="Enter document title"
                            required
                        >
                    </div>

                    <div class="form">
                        <label>Select PDF</label>
                        <input
                            type="file"
                            id="documentFile"
                            accept=".pdf"
                            required
                        >
                    </div>

                    <button type="submit" onclick="saveDocument()">Share Document</button>

                </form>
            </div>

            
            <div class="main">
                <h1>Create a poll</h1>

                <form class="eventform" >

                    <div class="form">
                        <label>Your Question *</label>

                        <textarea
                            id="pollQuestion"
                            rows="3"
                            placeholder="How do you commute to work?"
                            required
                        ></textarea>
                    </div>

                    <div class="form">
                        <label>Option 1 *</label>

                        <input
                            type="text"
                            id="option1"
                            placeholder="Public transportation"
                            required
                        >
                    </div>

                    <div class="form">
                        <label>Option 2 *</label>

                        <input
                            type="text"
                            id="option2"
                            placeholder="Drive myself"
                            required
                        >
                    </div>

                    <div id="extraOptions"></div>

                    <div class="form">
                        <button type="button"> + Add Option </button>
                    </div>

                    <div class="form">
                        <label>Poll duration</label>

                        <select id="pollDuration">
                            <option value="1 day">1 day</option>
                            <option value="3 days">3 days</option>
                            <option value="1 week">1 week</option>
                            <option value="2 weeks">2 weeks</option>
                        </select>
                    </div>

                    <button type="submit">Create Poll</button>

                </form>
            </div>
              
        </div>
        <div class="footer">
            <button onclick="post()">Post</button>
        </div>

        <div class="rendering">
            <h1>My Posts</h1>
            <table id="eventTable" class="table table-bordered">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Event Type</th>
                        <th>Event Name</th>
                        <th>Start Date</th>
                        <th>Start Time</th>
                        <th>End Date</th>
                        <th>End Time</th>
                        <th>Event Link</th>
                    </tr>
                </thead>
                <tbody id="eventTableBody"></tbody>
            </table>


        <h1>My Documents</h1>

            <div id="documentContainer"></div>
        </div>

        <script src="event.js"></script>
        <script src="document.js"></script>
    </body>
</html>
