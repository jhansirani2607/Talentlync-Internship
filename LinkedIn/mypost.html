<html>
    <head>
        <title>my post  page</title>
        <link
        rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="table.css">
        <link rel="stylesheet" href="card.css">
        <style>
            body {
                background-color: #f3f2ef;
                font-family: Arial;
            }
            button {
                padding: 10px 18px;
                background-color: #0a66c2;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
        </style>
    </head>
    <body onload="EventData();displayDocumentData()">
        <h1>My Posts</h1>
        <table id="eventTable" class="table table-bordered">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Event Type</th>
                    <th>Event Name</th>
                    <th>Start Date</th>
                    <th>Start Time</th>
                    <th>End Date</th>
                    <th>End Time</th>
                    <th>Event Link</th>
                </tr>
            </thead>
            <tbody id="eventTableBody"></tbody>
        </table>


       <h1>My Documents</h1>

        <div id="documentContainer"></div>


        <script src="event.js"></script>
        <script src="document.js"></script>

    </body>
</html>
