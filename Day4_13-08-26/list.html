<html>
    <head>
        <title>Basics of html</title>
    </head>
    <body>
        <ol type="1">
            <li>Apple</li>
            <li>BANANA</li>
            <li>guva</li>
        </ol>
        <ul type="disk">
            <li>Apple</li>
            <li>BANANA</li>
            <li>guva</li>
        </ul>
        <ul type="circle">
            <li>Course</li>
            <ol reversed type="A">
                <li>DSA</li>
                <li>php</li>
                <li>java</li>
                <li>python</li>
            </ol>
            <li>Money</li>
            <ol reversed start="6">
                <li>500</li> 
                <li>300</li>
                <li>507</li>  
                <li>200</li>         
            </ol>
        </ul>
    </body>
</html>
